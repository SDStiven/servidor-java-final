
server.port=${PORT:8080}

# Nome da aplicação
spring.application.name=servidorlocal

# Configuração da base de dados H2 guardada em ficheiro local
spring.datasource.url=${DB_URL:jdbc:h2:file:./dados/minhabase}
spring.datasource.driverClas14sName=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}

# Cria/Atualiza as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update

server.jpa.hibernate.ddl-size=128KB
server.tomcat.max-http-form-post-size=2MB
# Permite aceder à H2 Console via navegador (opcional)
spring.h2.console.enabled=true

# Configuração do Servidorde de Email(Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}

# Configuração avançada de segurança exigidas pelo Gmail
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

